app:
  id: ari:cloud:ecosystem::app/5270b9f7-f966-435f-8e60-11f193e0d1a2
  description: >-
    SoftBender brings Jira incident context and Bitbucket pull request signals
    into a read-only operational risk brief, with Rovo actions and Teamwork
    Graph team context. Revenue exposure is not estimated without a connected
    revenue data source.
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: softbender-incident-panel
      resource: softbender-frontend
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      title: SoftBender
      resolver:
        function: softbender-resolver

  jira:globalPage:
    - key: softbender-global-page
      resource: softbender-frontend
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resolver:
        function: softbender-resolver
      title: SoftBender Gateway
      pages:
        - title: Overview
          route: /softbender

  action:
    - key: calculate_deployment_risk
      name: Calculate deployment risk
      function: calculate-risk-action
      actionVerb: GET
      description: >-
        Read a Bitbucket pull request and optional Jira incident to return a
        transparent operational risk score. Revenue exposure is not available
        unless a revenue source is connected.
      inputs:
        pullRequestUrl:
          title: Bitbucket pull request URL
          type: string
          required: true
          description: Full URL of the Bitbucket pull request to analyze.
        jiraIssueKey:
          title: Related Jira issue key
          type: string
          required: false
          description: Optional Jira or JSM issue key to include as incident context.
    - key: get_incident_status
      name: Get incident status
      function: incident-status-action
      actionVerb: GET
      description: Read a Jira or JSM issue's summary, status, priority, and issue type.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: true
          description: Jira or JSM issue key, for example OPS-42.
    - key: query_teamwork_graph
      name: Query Teamwork Graph
      function: teamwork-graph-action
      actionVerb: GET
      description: Read the current user's Atlassian team memberships from Teamwork Graph.
      inputs:
        queryName:
          title: Supported graph query
          type: string
          required: true
          description: Use current-user-teams. Arbitrary GraphQL or Cypher is not accepted.

  rovo:agent:
    - key: softbender-risk-agent
      name: SoftBender Risk Sentinel
      description: Read-only Jira, Bitbucket, and Teamwork Graph operational context for incident response.
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      prompt: >-
        You are SoftBender, a read-only SRE operations analyst. Use the
        Calculate deployment risk skill and available actions to summarize
        verified Jira, Bitbucket, and Teamwork Graph signals. Distinguish
        observed facts from heuristics. Never claim revenue exposure, customer
        impact, or causality unless an explicitly connected data source
        supports it. The current app has no revenue data source, so say revenue
        exposure is unavailable. Do not modify issues or deployments.
      conversationStarters:
        - Assess this Bitbucket pull request's operational risk
        - Show the status and priority of a Jira incident
        - Which Atlassian teams am I a member of?
      actions:
        - calculate_deployment_risk
        - get_incident_status
        - query_teamwork_graph
      skills:
        - softbender-risk-skill

  rovo:skill:
    - key: softbender-risk-skill
      source:
        dir: skills/softbender-risk-analyst
      dependencies:
        tools:
          - calculate_deployment_risk
          - get_incident_status
          - query_teamwork_graph

  rovo:mcp:
    - key: softbender-mcp
      name: SoftBender Context Tools
      tools:
        - calculate_deployment_risk
        - get_incident_status
        - query_teamwork_graph

  function:
    - key: softbender-resolver
      handler: index.handler
    - key: calculate-risk-action
      handler: resolvers/rovo.calculateRiskAction
    - key: incident-status-action
      handler: mcp/server.getIncidentStatusAction
    - key: teamwork-graph-action
      handler: mcp/server.queryTeamworkGraphAction

resources:
  - key: softbender-frontend
    path: static/frontend

permissions:
  scopes:
    - read:jira-work
    - read:graph:issue:jira
    - read:graph:goal:atlassian
    - read:graph:deployment:external
    - read:graph:pull-request:external
    - read:graph:user:atlassian
    - read:graph:team:atlassian
